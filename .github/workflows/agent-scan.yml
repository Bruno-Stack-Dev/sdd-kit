# Snyk Agent Scan — só manual, com consentimento explícito. O scan inicia servidores MCP e envia
# configs/skills à API da Snyk: roda neste runner descartável, sem outros segredos além do SNYK_TOKEN.
# Sem token ou sem consentimento o resultado é NOT_RUN. Ver docs/security/agent-scan.md.
name: Agent scan (manual)

on:
  workflow_dispatch:
    inputs:
      consent:
        description: "Entendo que configs MCP e skills serão enviadas à API da Snyk"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  scan:
    name: snyk-agent-scan (versão fixada em scripts/commands/scan.mjs)
    if: inputs.consent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Instalar uv (versão fixada)
        run: python -m pip install uv==0.12.18
      - name: Agent scan
        run: node scripts/sdd.mjs scan agents --consent
