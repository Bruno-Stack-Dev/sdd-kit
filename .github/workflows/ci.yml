name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-node-tests:
    name: Lint + testes do linter (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: sdd-lint (specs/ + .claude/)
        run: node scripts/sdd-lint.mjs
      - name: Testes do kit (node:test, zero-dep)
        # Glob entre aspas: expandido pelo próprio node --test (Node >= 21), igual em Linux e Windows.
        run: node --test "tests/**/*.test.mjs"

  python-skill-tests:
    name: Testes Python das skills uiux-*
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pytest
        run: pip install pytest
      - name: pytest .claude/skills
        run: pytest .claude/skills
