# Evals comportamentais (com modelo) — noturno e manual, fora do caminho crítico do PR.
# Sem o segredo ANTHROPIC_API_KEY a suíte termina como NOT_RUN (não como aprovada).
# O Claude Agent SDK é instalado só aqui (não é dependência do kit).
name: Evals com modelo

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-model
  cancel-in-progress: false

jobs:
  model:
    name: Promptfoo + Claude Agent SDK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Evals determinísticas (pré-condição)
        run: node scripts/sdd.mjs eval run
      - name: Instalar o Claude Agent SDK (versão fixada, só neste job)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install --no-save --no-package-lock --ignore-scripts @anthropic-ai/claude-agent-sdk@0.3.280
      - name: Suíte com modelo (Promptfoo fixado em scripts/commands/eval.mjs)
        run: node scripts/sdd.mjs eval run --suite model
