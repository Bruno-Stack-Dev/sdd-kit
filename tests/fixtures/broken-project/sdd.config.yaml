# Fixture sintética do SDD Kit (sem código proprietário).
version: 3
project:
  name: Projeto Quebrado
  type: SaaS web
  domain: fixture sintética (SaaS web)
  stage: MVP
  updated_at: 2026-09-23
commands:
  test: npm test
paths:
  specs: specs/
numbering:
  prefix: QBR-
  increment: 10
  start: auto
pipelines:
  frontend:
    - id: contratos
      name: Contratos/tipos
      agent: agente-arquiteto-contratos
    - id: mocks
      name: Dados mockados
      agent: agente-mock-data
    - id: store
      name: Estado/store
      agent: agente-frontend
    - id: ui
      name: UI + rotas + menu
      agent: agente-frontend
    - id: testes
      name: Testes de componente
      agent: agente-qa-testes
    - id: e2e
      name: Testes e2e
      agent: agente-e2e
    - id: guardiao
      name: Guardião
      agent: agente-spec-guardian
      guardian: true
rules:
  - "Spec-driven: todo trabalho deriva de uma spec."
forbidden_patterns:
  - pattern: Date\.now\(\)
    scope: src/
    expected: 0
human_gates: []
blocked_topics: []
