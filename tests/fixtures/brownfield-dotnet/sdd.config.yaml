# Fixture sintética do SDD Kit (sem código proprietário).
version: 3
project:
  name: Estoque
  type: API .NET
  domain: fixture sintética (API .NET)
  stage: MVP
  updated_at: 2026-09-23
commands:
  test: dotnet test
  build: dotnet build
paths:
  specs: specs/
numbering:
  prefix: EST-
  increment: 10
  start: auto
pipelines:
  api:
    - id: contract
      name: Contrato de API
      agent: agente-arquiteto-contratos
    - id: migration
      name: Migration
      agent: agente-backend
    - id: repository
      name: Repositório
      agent: agente-backend
    - id: service
      name: Serviço
      agent: agente-backend
    - id: handler
      name: Handler + RBAC
      agent: agente-backend
    - id: integration-test
      name: Testes de integração
      agent: agente-qa-testes
    - id: guardian
      name: Guardião
      agent: agente-spec-guardian
      guardian: true
rules:
  - "Spec-driven: todo trabalho deriva de uma spec."
forbidden_patterns:
  - pattern: DateTime\.Now
    scope: src/
    expected: 1
    reason: "dívida conhecida (auditoria): usar IClock"
human_gates: []
blocked_topics: []
stack:
  language: C# 12
  framework: ASP.NET Core 9
  database: PostgreSQL
