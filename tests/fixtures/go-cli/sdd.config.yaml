# Fixture sintética do SDD Kit (sem código proprietário).
version: 3
project:
  name: Tarefas CLI
  type: CLI Go
  domain: fixture sintética (CLI Go)
  stage: MVP
  updated_at: 2026-09-23
commands:
  test: go test ./...
  lint: go vet ./...
paths:
  specs: specs/
numbering:
  prefix: TAR-
  increment: 10
  start: auto
pipelines:
  cli:
    - id: contract
      name: Contrato da CLI
      agent: agente-arquiteto-contratos
    - id: domain
      name: Domínio
      agent: agente-backend
    - id: command
      name: Comandos
      agent: agente-backend
    - id: adapter
      name: Adaptadores
      agent: agente-backend
    - id: unit-test
      name: Testes unitários
      agent: agente-qa-testes
    - id: integration-test
      name: Testes de integração
      agent: agente-qa-testes
    - id: guardian
      name: Guardião
      agent: agente-spec-guardian
      guardian: true
rules:
  - "Spec-driven: todo trabalho deriva de uma spec."
forbidden_patterns: []
human_gates: []
blocked_topics: []
stack:
  language: Go 1.23
  framework: cobra
